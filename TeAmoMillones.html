<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Te amo millones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: una consola portátil rosa sobre un cielo nocturno; pantalla pixel arriba, caja de diálogo RPG abajo */
:root{
  --night:#170e22; --dot:#3a2552;
  --shell:#f3a9c1; --shell-lo:#c9698d; --shell-hi:#ffd6e3;
  --bezel:#2a1f35; --panel:#1d1330; --ink:#fff3e4; --ink-dim:#c9b6d8;
  --rose:#ff5f93; --rose-deep:#b8325f; --sky:#8ec5ff; --gold:#ffd166;
  --paper:#fff6e8; --paper-ink:#3a2230; --scrim:rgba(23,14,34,.8);
  --f-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"Pixelify Sans", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background-color:var(--night); color:var(--ink); font-family:var(--f-body);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.6px),radial-gradient(var(--dot) 1px,transparent 1.6px);
  background-size:46px 46px; background-position:0 0,23px 23px;
}
.wrap{min-height:100%; box-sizing:border-box; display:grid; place-items:center; padding-inline:16px; padding-block:20px}
.console{
  position:relative; width:100%; max-width:540px; box-sizing:border-box;
  background:var(--shell); border-radius:18px 18px 46px 18px; padding:14px 14px 16px;
  display:grid; gap:12px; cursor:pointer;
  box-shadow:inset -5px -6px 0 var(--shell-lo), inset 5px 5px 0 var(--shell-hi), 0 14px 0 rgba(0,0,0,.4);
  user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.bezel{background:var(--bezel); border-radius:10px 10px 30px 10px; padding:10px 14px 16px; display:grid; gap:9px}
.bezel-top{display:flex; align-items:center; gap:8px; font-family:var(--f-pixel); font-size:8px; letter-spacing:.1em; color:var(--ink-dim)}
.led{width:7px; height:7px; border-radius:50%; background:var(--rose); box-shadow:0 0 8px var(--rose); flex:none}
#chap{margin-left:auto; color:var(--gold)}
canvas{display:block; width:100%; max-width:100%; aspect-ratio:4/3; image-rendering:pixelated; image-rendering:crisp-edges; background:#07050d}
.dlg{
  position:relative; background:var(--panel); border:3px solid var(--ink); border-radius:6px;
  box-shadow:0 0 0 3px var(--panel); padding:12px 14px 18px; min-height:6.6em;
  display:grid; align-content:start; gap:7px;
}
.who{justify-self:start; font-family:var(--f-pixel); font-size:10px; letter-spacing:.06em; padding:5px 8px 4px; background:var(--ink-dim); color:var(--panel)}
.who[data-who="v"]{background:var(--sky)}
.who[data-who="n"]{background:var(--rose); color:var(--ink)}
#txt{margin:0; font-size:clamp(17px,4.6vw,21px); line-height:1.35; min-height:2.7em; text-wrap:pretty}
#arrow{position:absolute; right:12px; bottom:6px; color:var(--gold); font-size:13px; animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.controls{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px}
.controls .mid{font-family:var(--f-pixel); font-size:8px; color:var(--rose-deep); letter-spacing:.08em}
.btn{
  font-family:var(--f-pixel); font-size:8px; letter-spacing:.06em; color:var(--ink); background:var(--shell-lo);
  border:0; border-radius:12px; padding:9px 11px 8px; cursor:pointer; box-shadow:0 3px 0 var(--rose-deep);
}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--rose-deep)}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.overlay{position:absolute; inset:0; z-index:5; display:grid; place-items:center; padding:14px; background:var(--scrim); border-radius:inherit; cursor:default}
.paper{
  width:100%; max-width:440px; max-height:100%; box-sizing:border-box; overflow:auto;
  background:var(--paper); color:var(--paper-ink); border:4px solid var(--paper-ink);
  box-shadow:6px 6px 0 rgba(0,0,0,.5); padding:18px 18px 20px; display:grid; gap:14px; cursor:pointer;
}
.paper-head{font-family:var(--f-pixel); font-size:11px; line-height:1.6; color:var(--rose-deep)}
.ltxt{white-space:pre-wrap; font-size:18px; line-height:1.5; min-height:6em}
.pbtn{justify-self:end; font-family:var(--f-pixel); font-size:10px; color:var(--ink); background:var(--rose-deep); border:0; padding:10px 14px 9px; cursor:pointer; box-shadow:0 3px 0 var(--paper-ink)}
.ask{background:var(--panel); border:3px solid var(--ink); box-shadow:0 0 0 3px var(--panel); padding:24px 18px; display:grid; gap:20px; text-align:center; max-width:380px}
.ask-q{font-family:var(--f-pixel); font-size:12px; line-height:1.9; margin:0; text-wrap:balance}
.ask-row{display:flex; gap:16px; justify-content:center}
.yes{font-family:var(--f-pixel); font-size:15px; padding:13px 24px 11px; color:var(--ink); background:var(--rose); border:0; cursor:pointer; box-shadow:0 4px 0 var(--rose-deep)}
.yes:active{transform:translateY(3px); box-shadow:0 1px 0 var(--rose-deep)}
.yes.big{font-size:20px; padding:16px 34px 14px}
.no{font-family:var(--f-pixel); font-size:15px; padding:13px 20px 11px; color:var(--ink); background:var(--bezel); border:3px solid var(--ink-dim); cursor:pointer; touch-action:manipulation}
.no.run{position:absolute; z-index:6; transition:left .18s steps(3), top .18s steps(3)}
.sign{margin:0; font-family:var(--f-pixel); font-size:11px; line-height:1.9; color:var(--panel); background:var(--gold); padding:12px 12px 10px; box-shadow:0 4px 0 var(--rose-deep); text-wrap:balance}
@media (prefers-reduced-motion: reduce){ .no.run{transition:none} }
@media (max-width: 460px){ .controls .mid{display:none} }
@media (prefers-reduced-motion: reduce){ #arrow{animation:none} }
</style>

<main class="wrap">
  <div class="console" id="console">
    <div class="bezel">
      <div class="bezel-top"><span class="led"></span><span id="names">VICTOR &amp; NICOLE</span><span id="chap">INTRO</span></div>
      <canvas id="screen" aria-label="Animación pixel art de la historia de Victor y Nicole"></canvas>
    </div>
    <div class="dlg" aria-live="polite">
      <div class="who" id="who" hidden></div>
      <p id="txt"></p>
      <span id="arrow" hidden>▼</span>
    </div>
    <div class="controls">
      <button class="btn" id="snd" type="button">SONIDO: SÍ</button>
      <span class="mid">TE AMO MILLONES</span>
      <button class="btn" id="again" type="button">REINICIAR</button>
    </div>

    <div class="overlay" id="letter" hidden>
      <div class="paper" id="paper">
        <div class="paper-head" id="lhead">STELLA MIA</div>
        <div class="ltxt" id="ltxt"></div>
        <button class="pbtn" id="lnext" type="button" hidden>SEGUIR ▶</button>
      </div>
    </div>

    <div class="overlay" id="ask" hidden>
      <div class="ask">
        <p class="ask-q">¿Jugamos este nivel para siempre?</p>
        <div class="ask-row"><button class="yes" id="yesBtn" type="button">SÍ</button><button class="no" id="noBtn" type="button">NO</button></div>
        <p class="sign" id="sign" hidden>Dale que sí, los 2 sabemos que es lo que quieres</p>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
/* ============================================================
   PERSONALIZA AQUÍ: nombres, recuerdos y la carta final
   ============================================================ */
const CONFIG = {
  el: 'Victor',
  ella: 'Nicole',
  anioInicio: '2025',
  anioRegreso: '2026',
  tituloCarta: 'Stella mia',
  recuerdos: [
    'Caminábamos sin rumbo, y cualquier lugar se volvía perfecto.',
    'Las charlas de madrugada. Ninguna noche era demasiado larga.',
    'Nos reíamos de todo, y también de nada.'
  ],
  carta:
`Stella mia:

Todo empezó cuando queríamos juntar a otros, y sin darnos cuenta terminamos encontrándonos a nosotros.

Vivimos cosas muy bonitas, y también días difíciles. No siempre supe cuidarte como merecías, y estar lejos de ti me enseñó cuánto significas para mí.

No quiero volver a lo de antes. Quiero construir algo mejor contigo: con más paciencia, más escucha y más cuidado.

Gracias por darnos otra oportunidad. Esta vez juego en tu equipo, en todos los niveles que vengan.

Te amo millones.

Victor`
};

/* ---------- base ---------- */
const W = 192, H = 144;
const cv = document.getElementById('screen'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = p => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
const $ = s => document.querySelector(s);
let clock = 0;
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

document.getElementById('names').textContent = (CONFIG.el + ' & ' + CONFIG.ella).toUpperCase();
document.getElementById('lhead').textContent = CONFIG.tituloCarta.toUpperCase() + ' ★';

/* ---------- texto pixel (umbral de alfa = bordes nítidos) ---------- */
const tcache = new Map();
let PIXEL_TEXT = true;
function hexRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function textImg(s, size, color) {
  const key = s + '|' + size + '|' + color;
  let c = tcache.get(key); if (c) return c;
  const font = size + 'px "Press Start 2P", monospace';
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  const w = Math.max(1, Math.ceil(m.measureText(s).width) + 2), h = size + 4;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.font = font; x.textBaseline = 'top';
  if (PIXEL_TEXT) {
    x.fillStyle = '#fff'; x.fillText(s, 0, 1);
    try {
      const d = x.getImageData(0, 0, w, h), [r, g, b] = hexRgb(color);
      for (let i = 0; i < d.data.length; i += 4) { const on = d.data[i + 3] > 110; d.data[i] = r; d.data[i + 1] = g; d.data[i + 2] = b; d.data[i + 3] = on ? 255 : 0; }
      x.putImageData(d, 0, 0);
    } catch (e) { PIXEL_TEXT = false; x.clearRect(0, 0, w, h); }
  }
  // Safari puede bloquear la lectura del canvas: entonces se dibuja el texto directo en su color
  if (!PIXEL_TEXT) { x.fillStyle = color; x.fillText(s, 0, 1); }
  tcache.set(key, c); return c;
}
function T(s, x, y, size = 8, color = '#ffffff', shadow = '#1a1024', align = 'center') {
  const img = textImg(s, size, color);
  const dx = align === 'center' ? Math.round(x - (img.width - 2) / 2) : Math.round(x);
  if (shadow) { const o = size / 8; ctx.drawImage(textImg(s, size, shadow), dx + o, Math.round(y) + o); }
  ctx.drawImage(img, dx, Math.round(y));
}
if (document.fonts) {
  Promise.all([document.fonts.load('8px "Press Start 2P"'), document.fonts.load('16px "Press Start 2P"')])
    .then(() => tcache.clear()).catch(() => {});
}

/* ---------- sprites ---------- */
const BODY = {
  boy: [
    '...hhhhhh...', '..hhhhhhhhh.', '..hhssshhhh.', '..hssssssh..', '..sesssses..',
    '..ssssssss..', '..sssmmsss..', '...ssssss...', '..bbbwwbbb..', '.bbbbbbbbbb.',
    '.bbbbbbbbbb.', '.bbbbbbbbbb.', '.sbbbbbbbbs.', '..pppppppp..', '..pppppppp..'
  ],
  girl: [
    '...hhhhhh...', '..hhhhhhffh.', '.hhhhhhhhhh.', '.hhsssssshh.', '.hsessssesh.',
    '.hssssssssh.', '.hsssmmsssh.', '.hhsssssshh.', '.hhkkkkkkhh.', '.hkkkkkkkkh.',
    '.hkkkkkkkkh.', '..kkkkkkkk..', '..skkkkkks..', '.dddddddddd.', '.dddddddddd.'
  ]
};
const LEGS = {
  boy: [['..ppp..ppp..', '..ppp..ppp..', '..ooo..ooo..'], ['..pp....pp..', '..pp....pp..', '.ooo....ooo.']],
  girl: [['...ss..ss...', '...ss..ss...', '...oo..oo...'], ['..ss....ss..', '..ss....ss..', '..oo....oo..']]
};
const EY = '#1b1530';
const PAL = {
  v: { h: '#2a1b12', s: '#f0c09a', e: EY, m: '#c9566c', b: '#3b6fd6', w: '#e9eef7', p: '#27324f', o: '#161320' },
  n: { h: '#6a3a22', s: '#f5cba7', e: EY, m: '#e0607e', k: '#f06a9b', d: '#b83d6e', o: '#4a2233', f: '#ffd35c' },
  a: { h: '#7a5230', s: '#e8b48c', e: EY, m: '#c9566c', b: '#3aa36b', w: '#e9eef7', p: '#3b3b52', o: '#161320' },
  b: { h: '#e5b04a', s: '#f5cba7', e: EY, m: '#e0607e', k: '#8a6be0', d: '#5a44a8', o: '#2a1d3a', f: '#ffffff' }
};
const scache = new Map();
function sprite(kind, pk, frame, back) {
  const key = kind + pk + frame + (back ? 1 : 0);
  let c = scache.get(key); if (c) return c;
  let rows = BODY[kind].concat(LEGS[kind][frame]);
  const last = kind === 'girl' ? 7 : 6;
  if (back) rows = rows.map((r, i) => (i >= 2 && i <= last) ? r.replace(/[sem]/g, 'h') : r);
  c = document.createElement('canvas'); c.width = 12; c.height = 18;
  const x = c.getContext('2d'), p = PAL[pk];
  rows.forEach((r, yy) => [...r].forEach((ch, xx) => { if (p[ch]) { x.fillStyle = p[ch]; x.fillRect(xx, yy, 1, 1); } }));
  scache.set(key, c); return c;
}
function mk(kind, pk) { return { kind, pk, x: -60, y: 122, tx: -60, ty: 122, speed: 50, walking: false, force: false, back: false, t: Math.random(), hop: 0 }; }
const C = { A: mk('boy', 'a'), B: mk('girl', 'b'), V: mk('boy', 'v'), N: mk('girl', 'n') };
function place(c, x, y, tx = x, ty = y) { Object.assign(c, { x, y, tx, ty, back: false, force: false, hop: 0 }); }
function hop(c) { c.hop = .4; }
function updChar(c, dt) {
  const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
  if (d > .5) { const s = Math.min(d, c.speed * dt); c.x += dx / d * s; c.y += dy / d * s; c.walking = true; }
  else { c.x = c.tx; c.y = c.ty; c.walking = false; }
  c.t += dt; if (c.hop > 0) c.hop = Math.max(0, c.hop - dt);
}
function drawChar(c) {
  const moving = c.walking || c.force;
  const f = moving ? Math.floor(c.t * 7) % 2 : 0;
  const hy = c.hop > 0 ? -Math.round(Math.sin(Math.PI * (1 - c.hop / .4)) * 5) : 0;
  R(c.x - 5, c.y - 1, 10, 2, 'rgba(20,10,30,.25)');
  ctx.drawImage(sprite(c.kind, c.pk, f, c.back), Math.round(c.x - 6), Math.round(c.y - 18 + hy - (moving && f ? 1 : 0)));
}
function drawChars(keys) { keys.map(k => C[k]).sort((a, b) => a.y - b.y).forEach(drawChar); }

const HEART = ['.xx.xx.', 'xxxxxxx', 'xxxxxxx', '.xxxxx.', '..xxx..', '...x...'];
function heart(x, y, c, s = 1, hl) {
  x = Math.round(x); y = Math.round(y); ctx.fillStyle = c;
  for (let j = 0; j < 6; j++) for (let i = 0; i < 7; i++) if (HEART[j][i] === 'x') ctx.fillRect(x + i * s, y + j * s, s, s);
  if (hl) { ctx.fillStyle = hl; ctx.fillRect(x + s, y + s, s, s); }
}

/* ---------- escenario ---------- */
const STARS = Array.from({ length: 70 }, () => ({ x: Math.floor(rnd(0, W)), y: Math.floor(rnd(0, H)), ph: rnd(0, 6.28), sp: rnd(1, 3), big: Math.random() < .12 }));
const FLOWERS = Array.from({ length: 28 }, (_, i) => ({ x: Math.floor(rnd(2, W - 2)), y: i % 2 ? Math.floor(rnd(99, 105)) : Math.floor(rnd(130, 143)), c: ['#ffffff', '#ffd166', '#ff8fb3', '#c8a2ff'][i % 4] }));
const CITY = [{ x: 0, w: 22, y: 70 }, { x: 24, w: 16, y: 84 }, { x: 42, w: 26, y: 64 }, { x: 70, w: 18, y: 78 }, { x: 90, w: 30, y: 58 }, { x: 122, w: 20, y: 74 }, { x: 144, w: 26, y: 62 }, { x: 172, w: 20, y: 80 }];
const NIGHT = [[0, '#0d0a1f'], [50, '#140e2b'], [100, '#1c1236']];
function bands(list, x0 = 0, w = W) { for (let i = 0; i < list.length; i++) { const y0 = list[i][0], y1 = i + 1 < list.length ? list[i + 1][0] : H; R(x0, y0, w, y1 - y0, list[i][1]); } }
function circle(cx, cy, r, c) { for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); R(cx - w, cy + dy, w * 2 + 1, 1, c); } }
function stars(t, maxY, x0 = 0, w = W) {
  for (const s of STARS) {
    if (s.y > maxY || s.x < x0 || s.x >= x0 + w) continue;
    const v = Math.sin(t * s.sp + s.ph);
    R(s.x, s.y, 1, 1, v > .5 ? '#ffffff' : v > -.3 ? '#b7aee0' : '#5d5590');
    if (s.big && v > .7) { R(s.x - 1, s.y, 3, 1, '#ffffff'); R(s.x, s.y - 1, 1, 3, '#ffffff'); }
  }
}
function cloud(x, y, c) { R(x + 5, y, 12, 2, c); R(x + 2, y + 2, 20, 3, c); R(x, y + 5, 26, 3, c); }
function hills(t, base, amp, freq, c, speed = 0, x0 = 0, w = W) {
  for (let x = x0; x < x0 + w; x += 2) { const u = x + t * speed; const h = base + Math.sin(u * freq) * amp + Math.sin(u * freq * 2.3 + 1) * amp * .4; R(x, h, 2, H - h, c); }
}
function tree(x, y, a = '#3f9a4a', b = '#5cbc63') { R(x - 1, y - 9, 3, 9, '#7a4b2a'); R(x - 7, y - 21, 14, 12, a); R(x - 5, y - 24, 10, 3, a); R(x - 8, y - 17, 16, 6, a); R(x - 5, y - 22, 5, 3, b); R(x - 6, y - 18, 3, 2, b); }
function line(a, b, c) { const n = Math.max(1, Math.abs(b.x - a.x), Math.abs(b.y - a.y)); for (let i = 0; i <= n; i++) R(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n, 1, 1, c); }
function drawPark(t, spring) {
  bands([[0, '#6fc0f2'], [22, '#86cbf5'], [42, '#9fd7f7'], [60, '#bde4f8'], [76, '#d6effa']]);
  circle(160, 20, 9, '#fff3b0'); circle(160, 20, 7, '#ffd95a');
  [[0, 12, 4], [80, 28, 6], [140, 44, 3]].forEach(([x, y, v]) => cloud(((x + t * v) % (W + 40)) - 30, y, '#ffffff'));
  hills(0, 80, 4, .045, '#a3dba0'); hills(0, 88, 3, .07, '#84c981');
  tree(14, 100); tree(44, 97, '#3a8f45', '#55b05d'); tree(152, 97, '#3a8f45', '#55b05d'); tree(180, 100);
  R(0, 98, W, 46, '#62b85c'); R(0, 106, W, 22, '#dcc38f'); R(0, 106, W, 1, '#c2a56f'); R(0, 127, W, 1, '#c2a56f');
  for (const f of FLOWERS) {
    R(f.x, f.y, 1, 1, f.c);
    if (spring) { R(f.x - 1, f.y, 1, 1, f.c); R(f.x + 1, f.y, 1, 1, f.c); R(f.x, f.y - 1, 1, 1, f.c); R(f.x, f.y, 1, 1, '#ffd166'); }
  }
  if (spring) for (let i = 0; i < 22; i++) { const x = ((i * 41 + t * 16) % (W + 10)) - 5, y = ((i * 23 + t * 11) % 104) + Math.sin(t * 2 + i) * 3; R(x, y, 2, 1, '#ffc2d6'); }
}
function hand(x, y, dir, sleeve) {
  x = Math.round(x);
  if (dir > 0) { R(x - 44, y - 1, 44, 10, sleeve); R(x, y, 8, 8, '#f0c09a'); R(x + 8, y + 1, 6, 3, '#f0c09a'); R(x, y + 6, 8, 2, '#d9a47e'); }
  else { R(x, y - 1, 44, 10, sleeve); R(x - 8, y, 8, 8, '#f5cba7'); R(x - 14, y + 1, 6, 3, '#f5cba7'); R(x - 8, y + 6, 8, 2, '#dca985'); }
}
function half(x0, ph, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x0, 0, 95, H); ctx.clip();
  if (ph === 0) {
    bands([[0, '#39405a'], [40, '#4a5270'], [80, '#5a6482']], x0, 95); R(x0, 112, 95, 32, '#34493b');
    for (let i = 0; i < 30; i++) { const x = x0 + ((i * 31.7 + t * 30) % 105) - 5, y = ((i * 43.1 + t * 160) % (H + 8)) - 6; R(x, y, 1, 4, '#a9b8dc'); }
  } else if (ph === 1) {
    bands([[0, '#0f0c29'], [40, '#1a1540'], [80, '#251d52']], x0, 95); stars(t, 110, x0, 95);
    circle(x0 + 72, 22, 6, '#fff3c4'); R(x0, 112, 95, 32, '#1b2233');
  } else {

    const c = G.catch; if (c.won) return;

/* ---------- motor de pasos + diálogo ---------- */
const whoEl = $('#who'), txtEl = $('#txt'), arrowEl = $('#arrow'), chapEl = $('#chap');
let si = -1, cur = null, stepT = 0, typing = false, full = '', shown = 0, lastN = 0, wantArrow = false;
function say(who, text, arrow) {
  whoEl.hidden = !who;
  whoEl.textContent = who === 'v' ? el : who === 'n' ? ella : '';
  whoEl.dataset.who = who || '';
  full = text; shown = 0; lastN = 0; typing = true; txtEl.textContent = ''; arrowEl.hidden = true; wantArrow = arrow;
}
function finishType() { typing = false; txtEl.textContent = full; arrowEl.hidden = !wantArrow; }
function next() {
  G.tap = null; si++;
  if (si >= STEPS.length) { restart(); return; }
  cur = STEPS[si]; stepT = 0; runStep(cur);
}
function runStep(s) {
  if (!s.card) G.card = null;
  if (s.chap) chapEl.textContent = s.chap;
  if (s.scene) setScene(s.scene);
  if ('music' in s) setMusic(s.music);
  if (s.do) s.do();
  if (s.card) { G.card = Object.assign({ t0: clock }, s.card); say(null, s.card.label, true); }
  if (s.say !== undefined) say(s.who || null, s.say, !s.until);
  if (!(s.say !== undefined || s.card || s.wait || s.until)) next();
}
function resetG() {
  for (const k of Object.keys(G)) delete G[k];
  Object.assign(G, { scene: 'intro', st: 0, parts: [], fade: 1, flash: 0, shake: 0, card: null, tap: null, loveAcc: 0 });
  for (const k in C) place(C[k], -60, 122);
  letterEl.hidden = true; askEl.hidden = true; clearInterval(letterTimer);
}
function restart() { resetG(); setMusic(null); si = -1; next(); }

function handleTap(px, py, onCanvas) {
  initAudio();
  if (!cur) return;
  if (typing) { finishType(); if (!(cur.until && G.tap)) return; }
  if (cur.until) { if (G.tap && onCanvas) G.tap(px, py); return; }
  if (cur.say !== undefined || cur.card) { sfx('blip'); next(); }
}
$('#console').addEventListener(window.PointerEvent ? 'pointerdown' : 'touchstart', e => {
  const ev0 = e;
  if (ev0.touches && ev0.touches[0]) e = { target: ev0.target, preventDefault: () => ev0.preventDefault(), clientX: ev0.touches[0].clientX, clientY: ev0.touches[0].clientY };
  if (e.target.closest('button') || e.target.closest('.overlay')) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const on = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  try { handleTap(on ? (e.clientX - r.left) / r.width * W : null, on ? (e.clientY - r.top) / r.height * H : null, on); } catch (err) { reportError(err); }
});

/* ---------- bucle ---------- */
function update(dt) {
  if (cur) {
    stepT += dt;
    if (cur.until) { if (cur.until()) next(); }
    else if (cur.wait && cur.say === undefined && !cur.card && stepT >= cur.wait) next();
  }
  for (const k in C) updChar(C[k], dt);
  for (const p of G.parts) { p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  G.parts = G.parts.filter(p => p.age < p.life);
  const sc = SC[G.scene]; if (sc.update) sc.update(dt);
  const a = G.arrow;
  if (a && !a.done) {
    a.x += 170 * dt;
    if (!a.hitV && a.x >= V.x) { a.hitV = true; burst(V.x, V.y - 12, 10); hop(V); sfx('pop'); }
    if (!a.hitN && a.x >= N.x) { a.hitN = true; burst(N.x, N.y - 12, 10); hop(N); sfx('pop'); }
    if (a.x > W + 24) a.done = true;
  }
  if (G.love) { G.loveAcc += dt; if (G.loveAcc > 1) { G.loveAcc = 0; floatHeart((V.x + N.x) / 2, Math.min(V.y, N.y) - 24); } }
  const h = G.hud;
  if (h && h.refill) {
    h.acc += dt;
    if (h.acc > .15) { h.acc = 0; if (h.filled < 5) h.filled++; else if (h.extra < 5) h.extra++; else h.refill = false; if (A.ctx && !A.muted) tone(520 + (h.filled + h.extra) * 70, A.ctx.currentTime, .06, 'square', .04); }
  }
  if (typing) {
    shown += dt * 42; const n = Math.min(full.length, Math.floor(shown));
    if (n !== lastN) { lastN = n; txtEl.textContent = full.slice(0, n); if (n % 3 === 0 && full[n - 1] !== ' ') sfx('tick'); }
    if (n >= full.length) finishType();
  }
  G.flash = Math.max(0, G.flash - dt * 2.2); G.fade = Math.max(0, G.fade - dt * 2); G.shake = Math.max(0, G.shake - dt * 8);
}
function drawArrow() { const a = G.arrow, x = Math.round(a.x), y = a.y; R(x - 16, y, 14, 1, '#8a5a2b'); R(x - 18, y - 2, 3, 2, '#ffffff'); R(x - 18, y + 1, 3, 2, '#ffffff'); heart(x - 3, y - 3, '#ff4d85'); }
function drawHud() {
  const h = G.hud; if (!h) return;
  for (let i = 0; i < 5; i++) heart(5 + i * 9, 5, i < h.filled ? '#ff4d85' : '#3b2b4a', 1, i < h.filled ? '#ffd0de' : null);
  for (let j = 0; j < h.extra; j++) heart(52 + j * 9, 5, '#ffd166', 1, '#ffffff');
}
function drawBanner() {
  const b = G.banner; if (!b || clock - b.t0 > b.dur) return;
  const w = b.s.length * 8 + 14;
  R(96 - w / 2 - 1, 23, w + 2, 18, '#ffd166'); R(96 - w / 2, 24, w, 16, '#1a1024');
  if (Math.floor((clock - b.t0) * 4) % 2 === 0 || clock - b.t0 > 1.5) T(b.s, 96, 28, 8, '#ffd166', null);
}
function drawCard() {
  const c = G.card, e = clock - c.t0, o = Math.round((1 - ease(e / .5)) * 8);
  R(0, 0, W, H, '#0d0a1f'); stars(clock, H);
  T(c.n, 96, 36 + o, 8, '#ff6f9c');
  for (let i = -2; i <= 2; i++) heart(96 + i * 12 - 3, 54, i === 0 ? '#ff4d85' : '#3b2b4a');
  T(c.title, 96, 72 - o, 8, '#ffffff');
  if (c.year) T(c.year, 96, 90, 8, '#ffd166');
  if (Math.floor(clock * 2) % 2 === 0) T('TOCA PARA SEGUIR', 96, 124, 8, '#8f86b8', null);
}
function render() {
  R(0, 0, W, H, '#07050d');
  ctx.save();
  if (G.shake > 0 && !REDUCE) ctx.translate(Math.round(rnd(-G.shake, G.shake)), Math.round(rnd(-G.shake, G.shake)));
  const sc = SC[G.scene];
  sc.draw(clock);
  if (sc.chars) drawChars(sc.chars);
  if (G.arrow && !G.arrow.done) drawArrow();
  drawParts();
  if (sc.post) sc.post(clock);
  drawHud(); drawBanner();
  if (G.scene === 'park' && G.mission && !G.mission.won && cur && cur.until && Math.floor(clock * 2) % 2 === 0) T('¡TOCA!', 96, 8, 8, '#ffffff', '#1a1024');
  ctx.restore();
  if (G.card) drawCard();
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, G.flash)})`; ctx.fillRect(0, 0, W, H); }
  if (G.fade > 0) { ctx.fillStyle = `rgba(7,5,13,${Math.min(1, G.fade)})`; ctx.fillRect(0, 0, W, H); }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  requestAnimationFrame(frame);
  // un error en un cuadro no debe congelar toda la animación
  try { update(dt); render(); } catch (e) { reportError(e); }
}
let errShown = false;
function reportError(e) {
  if (errShown) return; errShown = true;
  if (location.hash === '#debug') txtEl.textContent = 'Error: ' + (e && e.message ? e.message : e);
  if (window.console) console.error(e);
}
window.addEventListener('error', ev => reportError(ev.error || ev.message));
requestAnimationFrame(frame);
try { resetG(); next(); } catch (e) { reportError(e); }
})();
</script>
